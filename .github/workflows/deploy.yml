name: Deploy Consulting Growth 360

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-consulting
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Zero-Downtime Deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 72.61.0.11
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /root/consultinggrowth360
            git fetch origin main
            git checkout -B main origin/main
            git pull --ff-only origin main
            /root/deploy-consultinggrowth360.sh
